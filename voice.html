<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AfterFX Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#191310; --paper:#f6f1e8; --card:#fffdf8; --rule:#e5dccb; --hair:#efe7d8;
  --dim:#7d7263; --gold:#a8791d; --gold-lt:#d9b45a; --gold-pale:#f0e2bd;
  --maroon:#8c1c2f; --done:#1c6349;
  --ui:'Archivo',system-ui,-apple-system,sans-serif;
  --tel:'Noto Sans Telugu',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.6 var(--ui);
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}

header{padding:14px 16px;border-bottom:1px solid var(--rule);background:var(--card);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font:600 13px/1.3 var(--ui);letter-spacing:.16em;text-transform:uppercase}
header h1::before{content:"";display:inline-block;width:3px;height:13px;margin-right:9px;
  vertical-align:-1px;background:linear-gradient(var(--gold-lt),var(--gold))}
header select{margin-left:auto;padding:6px 8px;font:13px var(--ui);color:var(--ink);
  background:#fff;border:1px solid var(--rule);border-radius:2px}
#gear{padding:6px 10px;font:500 12.5px var(--ui);background:#fff;border:1px solid var(--rule);
  border-radius:2px;cursor:pointer}

#setup{display:none;padding:14px 16px;border-bottom:1px solid var(--rule);background:#fffdf3}
#setup.on{display:block}
#setup label{display:block;font:12.5px var(--ui);color:var(--dim);margin-bottom:5px}
#setup input{width:100%;padding:9px 11px;font:14px var(--ui);border:1px solid var(--rule);
  border-radius:2px;background:#fff;color:var(--ink);outline:none}
#setup input:focus{border-color:var(--gold-lt)}
#setup .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
#setup .hint{font:12px/1.5 var(--ui);color:var(--dim);margin-top:9px}
#setup a{color:var(--gold)}

#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(680px,92%);padding:11px 14px;border-radius:2px;white-space:pre-wrap;
  word-wrap:break-word;font-size:15px}
.msg.me{align-self:flex-end;background:var(--gold-pale);border:1px solid var(--gold-lt)}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--rule)}
.msg.sys{align-self:center;background:none;border:0;color:var(--dim);font-size:13px;
  text-align:center;padding:4px}
.msg.err{align-self:center;background:#fff4f4;border:1px solid #e6c9c9;color:var(--maroon);
  font-size:13.5px}
.msg .tel{font-family:var(--tel)}
.acts{display:flex;gap:8px;margin-top:9px}
.acts button{padding:5px 10px;font:500 12px var(--ui);background:#fff;border:1px solid var(--rule);
  border-radius:2px;cursor:pointer;color:var(--ink)}
.acts button:hover{border-color:var(--gold-lt)}
.dots::after{content:"";animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

footer{border-top:1px solid var(--rule);background:var(--card);padding:12px 16px 14px;
  display:flex;gap:10px;align-items:center}
#say{width:62px;height:62px;flex:0 0 62px;border-radius:50%;border:0;cursor:pointer;
  background:var(--gold);color:#fff;display:grid;place-items:center}
#say svg{width:26px;height:26px;fill:#fff}
#say.rec{background:var(--maroon);animation:p 1.1s ease-in-out infinite}
#say:disabled{opacity:.45;cursor:default;animation:none}
@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(140,28,47,.45)}70%{box-shadow:0 0 0 14px rgba(140,28,47,0)}}
#typed{flex:1;padding:11px 12px;font:15px var(--ui);border:1px solid var(--rule);border-radius:2px;
  background:#fff;color:var(--ink);outline:none;min-width:0}
#typed:focus{border-color:var(--gold-lt)}
#send,#shut{padding:11px 13px;font:500 13px var(--ui);background:#fff;border:1px solid var(--rule);
  border-radius:2px;cursor:pointer}
#shut{display:none;color:var(--maroon);border-color:#e6c9c9}
#shut.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:520px){
  header h1{font-size:12px}
  #say{width:56px;height:56px;flex:0 0 56px}
  #send{display:none}
}
</style>
</head>
<body>

<header>
  <h1>AfterFX Voice</h1>
  <select id="lang" title="Language you speak in">
    <option value="te-IN">Telugu</option>
    <option value="hi-IN" selected>Hindi</option>
    <option value="en-IN">English</option>
  </select>
  <button id="gear" type="button">Key</button>
</header>

<div id="setup">
  <label for="key">Gemini API key &mdash; saved in this browser only, never sent anywhere else</label>
  <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
  <div class="row">
    <button id="savekey" style="padding:8px 14px;font:600 13px var(--ui);background:var(--gold);color:#fff;border:0;border-radius:2px;cursor:pointer">Save key</button>
    <button id="clearkey" style="padding:8px 12px;font:500 13px var(--ui);background:#fff;border:1px solid var(--rule);border-radius:2px;cursor:pointer">Remove</button>
    <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:12.5px">
      <input type="checkbox" id="speak" checked style="width:auto"> Read answers out loud
    </label>
  </div>
  <div class="hint">Get the key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> &mdash; the same "Afterfx templates" project.</div>
</div>

<div id="log"></div>

<footer>
  <button id="say" type="button" title="Press and speak" aria-label="Speak">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-4.08A7 7 0 0 0 19 11z"/></svg>
  </button>
  <input id="typed" placeholder="…or type it here" autocomplete="off">
  <button id="send" type="button">Send</button>
  <button id="shut" type="button">Stop</button>
</footer>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var MODEL = "gemini-3.6-flash";
  var KEYK = "afxVoiceKey", LANGK = "afxVoiceLang", SPK = "afxVoiceSpeak";

  /* ---------- who this assistant is ---------- */
  var SYS = [
    "You are Rafi's personal work assistant. Rafi (Mohammad Rafi) runs AfterFX Templates",
    "(afterfxtemplates.com), selling After Effects invitation video templates and making custom",
    "name-reveal and invitation videos for South Indian celebrations — naming ceremonies,",
    "weddings, engagements, gruhapravesam, upanayanam, annaprashan, half saree functions.",
    "He works in After Effects, Photoshop and Premiere Pro, and builds videos with AI image and",
    "video tools. Themes are usually deities: Shiva, Krishna-Radha, Ganesha, Murugan, Vishnu, Durga.",
    "",
    "HIS PRICES — template project file: Rs 300 each. Bundle rates: 5-9 = Rs 200 each,",
    "10-19 = Rs 175 each, 20 = Rs 150 each. Custom name-reveal videos: Rs 2,500 to Rs 11,000",
    "depending on length and scene count. Premium templates bill at full price inside a bundle.",
    "The price is for the PROJECT FILE, not a finished rendered video — customization is charged",
    "separately. Licence is own-use only.",
    "",
    "HIS LINKS — store afterfxtemplates.com, bundle calculator afterfxtemplates.com/bundle.html,",
    "re-download page afterfxtemplates.com/myorders.html, Telugu-ANU converter",
    "afterfxtemplates.com/anu-converter.html. WhatsApp 8971738710.",
    "",
    "HOW TO ANSWER — you are being spoken to out loud, so keep it SHORT: two or three sentences",
    "unless he asks for something longer. Reply in casual Hinglish (Roman script) by default,",
    "and call him bhai. If he speaks Telugu, reply in Telugu. When he asks for a client reply or",
    "a message, give ONLY the message text, ready to paste into WhatsApp, with nothing before or",
    "after it. Do the arithmetic yourself when a bundle price is involved. If you are not sure of",
    "a fact about his business, say so plainly instead of inventing it."
  ].join("\n");

  /* ---------- state ---------- */
  var history = [], busy = false, rec = null, listening = false;

  function key() { try { return localStorage.getItem(KEYK) || ""; } catch (e) { return ""; } }

  function add(cls, text) {
    var el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    $("log").appendChild(el);
    $("log").scrollTop = $("log").scrollHeight;
    return el;
  }

  function addReply(text) {
    var el = add("ai", text);
    var acts = document.createElement("div");
    acts.className = "acts";

    var c = document.createElement("button");
    c.type = "button"; c.textContent = "Copy";
    c.addEventListener("click", function () {
      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
      c.textContent = "Copied";
      setTimeout(function () { c.textContent = "Copy"; }, 1200);
    });
    acts.appendChild(c);

    var w = document.createElement("button");
    w.type = "button"; w.textContent = "WhatsApp";
    w.addEventListener("click", function () {
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
    });
    acts.appendChild(w);

    var r = document.createElement("button");
    r.type = "button"; r.textContent = "Play again";
    r.addEventListener("click", function () { speak(text); });
    acts.appendChild(r);

    el.appendChild(acts);
    $("log").scrollTop = $("log").scrollHeight;
  }

  /* ---------- speaking ---------- */
  function speak(text) {
    if (!window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var want = $("lang").value;
      var vs = speechSynthesis.getVoices() || [];
      var v = vs.filter(function (x) { return x.lang === want; })[0] ||
              vs.filter(function (x) { return x.lang && x.lang.indexOf(want.split("-")[0]) === 0; })[0] ||
              vs.filter(function (x) { return x.lang === "en-IN"; })[0];
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = want; }
      u.rate = 1.02;
      u.onstart = function () { $("shut").classList.add("on"); };
      u.onend = u.onerror = function () { $("shut").classList.remove("on"); };
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function () {};

  $("shut").addEventListener("click", function () {
    try { speechSynthesis.cancel(); } catch (e) {}
    this.classList.remove("on");
  });

  /* ---------- the brain ---------- */
  function ask(text) {
    if (busy) return;
    if (!key()) {
      add("err", "Add your Gemini key first \u2014 the Key button above.");
      $("setup").classList.add("on");
      return;
    }
    busy = true;
    $("say").disabled = true;
    add("me", text);
    history.push({ role: "user", parts: [{ text: text }] });
    if (history.length > 20) history = history.slice(-20);

    var wait = add("sys", "thinking");
    wait.classList.add("dots");

    fetch("https://generativelanguage.googleapis.com/v1beta/models/" + MODEL +
          ":generateContent?key=" + encodeURIComponent(key()), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYS }] },
        contents: history,
        generationConfig: { temperature: 0.7, maxOutputTokens: 8192 }
      })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
    }).then(function (res) {
      wait.remove();
      if (!res.ok) {
        var m = res.j && res.j.error && res.j.error.message ? res.j.error.message : ("HTTP " + res.status);
        add("err", res.status === 400 ? "That key looks wrong \u2014 " + m : m);
        return;
      }
      var cand = res.j.candidates && res.j.candidates[0];
      var parts = cand && cand.content && cand.content.parts ? cand.content.parts : [];
      var out = parts.map(function (p) { return p.text || ""; }).join("").trim();
      if (!out) { add("err", "Empty answer came back. Ask again."); return; }
      history.push({ role: "model", parts: [{ text: out }] });
      addReply(out);
      if ($("speak").checked) speak(out);
    }).catch(function (e) {
      wait.remove();
      add("err", "Network or key problem: " + e.message);
    }).then(function () {
      busy = false;
      $("say").disabled = false;
    });
  }

  /* ---------- listening ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function startRec() {
    if (!SR) {
      add("err", "This browser cannot listen. Open it in Chrome, or type below.");
      return;
    }
    try { speechSynthesis.cancel(); } catch (e) {}
    rec = new SR();
    rec.lang = $("lang").value;
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    var live = null, finalText = "";

    rec.onstart = function () {
      listening = true;
      $("say").classList.add("rec");
      live = add("sys", "listening\u2026");
    };
    rec.onresult = function (ev) {
      var interim = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;
      }
      if (live) live.textContent = (finalText + interim).trim() || "listening\u2026";
    };
    rec.onerror = function (ev) {
      if (live) live.remove();
      live = null;
      if (ev.error === "not-allowed")
        add("err", "Microphone permission was refused. Allow it from the lock icon in the address bar.");
      else if (ev.error !== "aborted" && ev.error !== "no-speech")
        add("err", "Microphone error: " + ev.error);
    };
    rec.onend = function () {
      listening = false;
      $("say").classList.remove("rec");
      if (live) live.remove();
      var t = finalText.trim();
      if (t) ask(t);
    };
    try { rec.start(); } catch (e) { add("err", "Microphone did not start: " + e.message); }
  }

  $("say").addEventListener("click", function () {
    if (listening) { try { rec.stop(); } catch (e) {} return; }
    startRec();
  });

  /* ---------- typing fallback ---------- */
  function sendTyped() {
    var t = $("typed").value.trim();
    if (!t) return;
    $("typed").value = "";
    ask(t);
  }
  $("send").addEventListener("click", sendTyped);
  $("typed").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); sendTyped(); }
  });

  /* ---------- settings ---------- */
  $("gear").addEventListener("click", function () { $("setup").classList.toggle("on"); });
  $("savekey").addEventListener("click", function () {
    var v = $("key").value.trim();
    if (!v) return;
    try { localStorage.setItem(KEYK, v); } catch (e) {}
    $("setup").classList.remove("on");
    add("sys", "Key saved.");
  });
  $("clearkey").addEventListener("click", function () {
    try { localStorage.removeItem(KEYK); } catch (e) {}
    $("key").value = "";
    add("sys", "Key removed.");
  });
  $("lang").addEventListener("change", function () {
    try { localStorage.setItem(LANGK, this.value); } catch (e) {}
  });
  $("speak").addEventListener("change", function () {
    try { localStorage.setItem(SPK, this.checked ? "1" : "0"); } catch (e) {}
  });

  /* ---------- boot ---------- */
  try {
    var L = localStorage.getItem(LANGK);
    if (L) $("lang").value = L;
    if (localStorage.getItem(SPK) === "0") $("speak").checked = false;
    if (key()) $("key").value = key();
  } catch (e) {}

  if (!key()) {
    $("setup").classList.add("on");
    add("sys", "Add your Gemini key above to start.");
  } else {
    add("sys", "Press the microphone and speak \u2014 or type below.");
  }
  if (!SR) add("sys", "This browser cannot listen, so you will need to type.");
})();
</script>
</body>
</html>
