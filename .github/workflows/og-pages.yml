name: Generate template share pages

on:
  push:
    branches: [main]
    # BUG 1 FIX: also run when the generator or this workflow itself changes,
    # not only when templates.json is uploaded.
    paths:
      - 'templates.json'
      - 'scripts/gen-og.js'
      - '.github/workflows/og-pages.yml'
  workflow_dispatch:            # lets you run it manually any time

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build pages and sitemap
        run: node scripts/gen-og.js
      - name: Commit pages
        run: |
          git config user.name  "og-bot"
          git config user.email "og-bot@users.noreply.github.com"
          # BUG 2 FIX: "git add t" dropped the category pages and the sitemap.
          # -A also stages deletions, so removed templates clean up their folders.
          git add -A t c sitemap.xml
          git diff --cached --quiet || git commit -m "Auto: regenerate pages + sitemap [skip ci]"
          git push
